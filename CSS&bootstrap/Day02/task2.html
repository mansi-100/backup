<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Task 2</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>

<body class="d-flex align-items-center vh-100">
  <div class="container">
    <div class="register-form text-center">
      <h1 class="form-title title">Register</h1>
      <p class="text-muted mb-4">Create your account. It's free and only takes a minute.</p>
      <form action="">
        <div class="row">
          <div class="col-12 col-sm-6">
            <input type="text" class="form-control" placeholder="First Name" pattern="[A-Za-z]+" required>
          </div>
          <div class="col-12 col-sm-6">
            <input type="text" class="form-control" placeholder="Last Name"  pattern="[A-Za-z]+" required>
          </div>
        </div>
        <div class="mt-3">
          <input type="email" class="form-control" placeholder="Email"  required>
        </div>
        <div class="mt-3">
          <input type="password" id="pass1" class="form-control" placeholder="Password" pattern="[a-zA-Z@]{5}" required>
        </div>
        <div class="mt-3">
          <input type="password" id="pass2" class="form-control" placeholder="Confirm Password" required>
          <p class="text-danger" id="msg" style="display: none;">Password should be same</p>
        </div>
        <div class="form-check mt-3 text-start">
          <input class="form-check-input" type="checkbox" id="terms" required>
          <label class="form-check-label text-muted" for="terms">
            I accept the <a href="#">Terms of Use</a> & <a href="#">Privacy Policy</a>
          </label>
        </div>
        <button type="submit" onclick="check()" class="btn btn-success w-100 mt-4">Register Now</button>
      </form>
     
    </div>
    <p class="text-center text-white"><br>
      Already have an account? <a href="#" style="color: white;">Sign in</a>
    </p>
    </div>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
  <script>
     function check() {
    let password = document.getElementById("pass1").value;
    let confirmpass = document.getElementById("pass2").value;

    if (password !== confirmpass) {
        document.getElementById("msg").style.display = 'block';
    } else {
        document.getElementById("msg").style.display = 'none'; 
    }
}


  </script>
</body>
</html>
