


<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Responsive Bootstrap Grid</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha3/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        .grid-box {
            background-color: gray;
            border: 1px solid #b8daff;
            padding: 20px;
            margin-bottom: 15px;
            text-align: center;
            height: 150px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-bottom-right-radius: 15px;
            border-bottom-left-radius: 15px;
            border-top-right-radius: 15px;
            border-top-left-radius: 15px;
        }

        .container {
            padding: 20px;
        }

        h1 {
            text-align: center;
            margin-bottom: 30px;
        }

        @media(min-width:991px) {
            .colorbox1 {
                background-color: #cce5ff;
                border: 1px solid #b8daff;
                padding: 20px;
                margin-bottom: 15px;
                text-align: center;
                height: 150px;
                display: flex;
                align-items: center;
                justify-content: center;
                border-bottom-right-radius: 15px;
                border-bottom-left-radius: 15px;
                border-top-right-radius: 15px;
                border-top-left-radius: 15px;
            }
        }

        @media(min-width:768px)and (max-width:990px) {
            .colorbox2 {
                background-color: #cce5ff;
                border: 1px solid #b8daff;
                padding: 20px;
                margin-bottom: 15px;
                text-align: center;
                height: 150px;
                display: flex;
                align-items: center;
                justify-content: center;
                border-bottom-right-radius: 15px;
                border-bottom-left-radius: 15px;
                border-top-right-radius: 15px;
                border-top-left-radius: 15px;
            }
        }

        @media(min-width:577px) and (max-width:768px) {
            .colorbox3 {
                background-color: #cce5ff;
                border: 1px solid #b8daff;
                padding: 20px;
                margin-bottom: 15px;
                text-align: center;
                height: 150px;
                display: flex;
                align-items: center;
                justify-content: center;
                border-bottom-right-radius: 15px;
                border-bottom-left-radius: 15px;
                border-top-right-radius: 15px;
                border-top-left-radius: 15px;
            }
        }
            @media(max-width:576px) {
                .gridbox1 {
                    background-color: #cce5ff;
                    border: 1px solid #b8daff;
                    padding: 20px; 
                    margin-bottom: 15px;
                    text-align: center;
                    height: 150px;
                    display: flex;
                    align-items: center;
                    justify-content: center;
                    border-bottom-right-radius: 15px;
                    border-bottom-left-radius: 15px;
                    border-top-right-radius: 15px;
                    border-top-left-radius: 15px;
                }
            }
        
    </style>
</head>

<body>
    <div class="container">
        <h1>Responsive Grid Layout</h1>
        <div class="row">
            <!-- 12 grid items -->
            <div class="col-12 col-sm-6 col-md-4 col-lg-3">
                <div class="colorbox1 colorbox2 colorbox3 grid-box ">Box 1</div>
            </div>
            <div class="col-12 col-sm-6 col-md-4 col-lg-3">
                <div class="grid-box gridbox1">Box 2</div>
            </div>
            <div class="col-12 col-sm-6 col-md-4 col-lg-3">
                <div class="grid-box colorbox3  ">Box 3</div>
            </div>
            <div class="col-12 col-sm-6 col-md-4 col-lg-3">
                <div class="colorbox2 grid-box gridbox1 ">Box 4</div>
            </div>
            <div class="col-12 col-sm-6 col-md-4 col-lg-3">
                <div class="grid-box colorbox1 colorbox3  ">Box 5</div>
            </div>
            <div class="col-12 col-sm-6 col-md-4 col-lg-3">
                <div class="grid-box gridbox1">Box 6</div>
            </div>
            <div class="col-12 col-sm-6 col-md-4 col-lg-3">
                <div class="grid-box colorbox2 colorbox3 ">Box 7</div>
            </div>
            <div class="col-12 col-sm-6 col-md-4 col-lg-3">
                <div class="grid-box gridbox1">Box 8</div>
            </div>
            <div class="col-12 col-sm-6 col-md-4 col-lg-3">
                <div class="colorbox1 grid-box colorbox3  ">Box 9</div>
            </div>
            <div class="col-12 col-sm-6 col-md-4 col-lg-3">
                <div class="grid-box colorbox2 gridbox1">Box 10</div>
            </div>
            <div class="col-12 col-sm-6 col-md-4 col-lg-3">
                <div class="grid-box colorbox3  ">Box 11</div>
            </div>
            <div class="col-12 col-sm-6 col-md-4 col-lg-3">
                <div class="grid-box gridbox1">Box 12</div>
            </div>
        </div>
    </div>
</body>

</html>
