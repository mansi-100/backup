<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>task1</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
  </head>
  <body>
    <div class="container">
      <div class="row g-3 justify-content-center py-5">
        <div class="col-auto ">
          <button type="button" class="btn btn-danger" title="A demo of left tooltip" data-bs-placement="left">Left Demo</button>
        </div>
        <div class="col-auto ">
          <button type="button" class="btn btn-success" title="A demo of bottom tooltip" data-bs-placement="bottom">Bottom Demo</button>
        </div>
        <div class="col-auto ">
          <button type="button" class="btn btn-warning" title="A demo of Top tooltip" data-bs-placement="top">Top Demo</button>
        </div>
        <div class="col-auto ">
          <button type="button" class="btn btn-info" title="A demo of Right tooltip" data-bs-placement="right">Right Demo</button>
        </div>
       
      </div>
    </div>

<!--g-3 means gutter 3-->

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz" crossorigin="anonymous"></script>

    <script>
      var tooltipTriggerList = Array.from(document.querySelectorAll('[title]'));
      var tooltipList = tooltipTriggerList.map(function (tooltipTriggerEl) {
        return new bootstrap.Tooltip(tooltipTriggerEl, {
          placement: tooltipTriggerEl.getAttribute('data-bs-placement') || 'top'  
        });
      });
    </script>
  </body>
</html>
