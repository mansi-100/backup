<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>task1</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.4/css/all.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;700&display=swap" rel="stylesheet">

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-EVSTQN3/azprG1Anm3QDgpJLIm9Nao0Yz1ztcQTwFspd3yD65VohhpuuCOmLASjC" crossorigin="anonymous">
    <link rel="stylesheet" href="task1.css"> 
</head>

<body>
    <div class="container mt-5">
       <div class="row">
            <div class="col-sm-12 col-md-12 col-lg-12">
                <h3>Welcome, Let's Get Started</h3><br>
                <h5 class="mb-4">Log In</h5>

            </div>
       </div>
       <div class="row w-100  ">
            <div class="col-lg-6 col-md-8 col-sm-12 ">
                <form class="needs-validation">
                    <div class="mb-3">
                        <label for="validationServer02" class="form-label">Email</label>
                        <input type="email" class="form-control" id="validationServer02"  required>
                        <div class="valid-feedback">Looks good!</div>
                        <div class="invalid-feedback">Please enter a valid email address.</div>
                        </div>
                        <div class="mb-3">
                            <label for="exampleInputPassword1" class="form-label">Password</label>
                            <div class="input-group">
                                <input type="password" class="form-control" id="exampleInputPassword1">
                                <span class="input-group-text" id="togglePassword">
                                    <i class="fas fa-eye"></i> 
                                </span>
                            </div>
                            <div class="invalid-feedback">Please enter a valid password.</div>
                        </div>
                    <div class="mb-3 text-end ">
                       <a href="#">Forget Password?</a>
                      </div>
                    
                    <button type="submit" class="btn btn-success">Log in</button>
                  </form>

               
                 
               </div>
                <div class="col-lg-6 mb-2 text-center "><br>
                <img src="pass.png">
                </div>
                   
       </div>

    </div>
    
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/js/bootstrap.bundle.min.js" integrity="sha384-MrcW6ZMFYlzcLA8Nl+NtUVF0sA7MsXsP1UyJoMp4YLEuNSfAP+JcXn/tWtIaxVXM" crossorigin="anonymous"></script>
    <script>
        function updateFileName() {
      var input = document.getElementById('profilePicture');
      var fileName = document.getElementById('fileName');
      fileName.value = input.files[0].name;
    }
        const formElements = document.querySelectorAll('.needs-validation input, .needs-validation select, .needs-validation textarea, .needs-validation file');

        formElements.forEach(element => {
        element.addEventListener('blur', function() {
            if (element.checkValidity()) {
            element.classList.remove('is-invalid');
            element.classList.add('is-valid');
            } else {
            element.classList.remove('is-valid');
            element.classList.add('is-invalid');
            }
        });
        });

        (() => {
        'use strict'

        const forms = document.querySelectorAll('.needs-validation')

        Array.from(forms).forEach(form => {
            form.addEventListener('submit', event => {
            if (!form.checkValidity()) {
                event.preventDefault()
                event.stopPropagation()
            }

            form.classList.add('was-validated')
            }, false)
        })
        })()
    
    const togglePassword = document.getElementById('togglePassword');
    const passwordField = document.getElementById('exampleInputPassword1');

    togglePassword.addEventListener('click', function () {
        const type = passwordField.type === 'password' ? 'text' : 'password';
        passwordField.type = type;

        const icon = this.querySelector('i');
        if (type === 'password') {
            icon.classList.remove('fa-eye-slash');
            icon.classList.add('fa-eye');
        } else {
            icon.classList.remove('fa-eye');
            icon.classList.add('fa-eye-slash');
        }
    });
</script>
</body>
</html>
